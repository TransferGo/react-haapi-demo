name: Build Happi Demo

on:
    workflow_dispatch:
    push:
        branches:
            - master

jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Set up Node Js
              uses: actions/setup-node@v4
              with:
                node-version: 18.16

            - name: Install Dependencies
              run: npm install

            - name: Build Demo
              run: npm run build
              env:
                CI: ""

            - name: Create Archive
              run: zip -r build.zip build

            - name: Upload Archive
              uses: actions/upload-artifact@v4
              with:
                name: happi-demo.zip
                path: build.zip
